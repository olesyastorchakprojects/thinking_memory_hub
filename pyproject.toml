[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thinking-memory-hub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
]

[project.scripts]
memory-server = "memory_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app/memory_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests requiring a live PostgreSQL database",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
